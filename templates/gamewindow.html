<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeograGuess</title>
    <style>
        #street-view-container,
        #interactive-map {
            height: 500px;
            width: 100%;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <h1>Game page</h1>

    <div id="street-view-container"></div>
    <div id = "interactive-map"></div>

    <a href="{{ url_for('load_home_page') }}">
        <button id = "submit-btn" type="button">Submit Guess</button>
    </a>

    <a href="{{ url_for('load_home_page') }}">
        <button type="button">Go to Home Page</button>
    </a>

    {% if error_message %}
        <div style="color: #a94442; background: #f2dede; border: 1px solid #ebccd1; padding: 12px; margin-top: 16px;">
            <strong>Google Maps API error:</strong> {{ error_message }}
        </div>
    {% endif %}
    {% if api_key %}
        <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMaps" async defer></script>
    {% endif %}

    <script>
        START_LOC = { lat: 43.6426, lng: -79.3871 };

        function initMaps() {
            initStreetView();
            initSelectMap();
        }

        function initStreetView() {
            const start_loc = START_LOC;
            new google.maps.StreetViewPanorama(
                document.getElementById("street-view-container"),
                {
                    position: start_loc,
                    pov: { heading: 165, pitch: 0 },
                    zoom: 1,
                }
            );
        }

        function initSelectMap() {
            const start_loc = { lat: 43.6426, lng: -79.3871 };
            const map = new google.maps.Map(document.getElementById("interactive-map"), {
                center: start_loc,
                zoom: 14,
            });
            window.selectMap = map;
            window.selectMarker = new google.maps.Marker({
                position: start_loc,
                map: map,
                title: "Start location",
                draggable: true,
            });

            window.selectMarker.addListener("click", function(event) {
                const latitude = event.latLng.lat();
                const longitude = event.latLng.lng();
                console.log(latitude + ", " + longitude);
            });

            window.selectMarker.addListener("dragend", function(event) {
                const lat = event.latLng.lat();
                const lng = event.latLng.lng();
               //sendLocation(lat, lng);
            });

            map.addListener("click", function(event) {
                window.selectMarker.setPosition(event.latLng);
            });
        }
        
        function sendLocation(lat, lng) {
            fetch('/submit_guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lng: lng })
            })
            .then(r => r.json())
            .then(j => console.log('server response', j))
            .catch(err => console.error('sendLocation error', err));
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('submit-btn');
            if (btn) {
                btn.addEventListener('click', function() {
                    if (window.selectMarker) {
                        const pos = window.selectMarker.getPosition();
                        sendLocation(pos.lat(), pos.lng());
                    } else {
                        console.warn('No marker available to submit');
                    }
                });
            }
        });

    </script>

</body>
</html>
