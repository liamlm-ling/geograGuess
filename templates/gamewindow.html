<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeograGuess</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        #street-view-container,
        #interactive-map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Game page</h1>

    <div class = "flex-container">
        <div class = "column-left" id="street-view-container"></div>
        <div class = "column-right" id = "interactive-map"></div>
    </div>

    <div class="btn-row">
        <button id="submit-btn" type="button">Submit Guess</button>
        <a href="{{ url_for('load_home_page') }}">
            <button type="button">Go to Home Page</button>
        </a>
    </div>

    <div id="submit-result" style="margin-top: 12px; color: #222;"></div>

    {% if error_message %}
        <div style="color: #a94442; background: #f2dede; border: 1px solid #ebccd1; padding: 12px; margin-top: 16px;">
            <strong>Google Maps API error:</strong> {{ error_message }}
        </div>
    {% endif %}
    <script>

        window.answerCoords = {{ coords | tojson }};

        function initMaps() {
            initStreetView();
            initSelectMap();
        }

        window.initMaps = initMaps;

        function initStreetView() {
            const coords = window.answerCoords;
            new google.maps.StreetViewPanorama(
                document.getElementById("street-view-container"),
                {
                    pano: coords.id,
                    pov: { heading: 165, pitch: 0 },
                    zoom: 1,
                    clickableIcons: false
                }
            );
        }

        function initSelectMap() {
            const map = new google.maps.Map(document.getElementById("interactive-map"), {
                center: { lat: 0, lng: 0 },
                zoom: 1,
            });
            window.selectMap = map;
            window.selectMarker = new google.maps.Marker({
                position: {lat: 0, lng: 0},
                map: map,
                title: "Start location",
                draggable: true,
            });

            window.selectMarker.addListener("click", function(event) {
                const latitude = event.latLng.lat();
                const longitude = event.latLng.lng();
                console.log(latitude + ", " + longitude);
            });

            window.selectMarker.addListener("dragend", function(event) {
                const lat = event.latLng.lat();
                const lng = event.latLng.lng();
               //sendLocation(lat, lng);
            });

            map.addListener("click", function(event) {
                window.selectMarker.setPosition(event.latLng);
            });
        }
        
        function sendLocation(lat, lng) {
            fetch('/submit_guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lng: lng })
            })
            .then(r => r.json())
            .then(j => {
                console.log('server response', j);
                const result = document.getElementById('submit-result');
                if (j.error) {
                    result.textContent = 'Error: ' + j.error;
                    result.style.color = '#a94442';
                } else {
                    result.textContent = `Submitted: ${j.lat}, ${j.lng} — distance ${j.distance_km} km, score ${j.score}`;
                    result.style.color = '#2e7d32';
                    new google.maps.Marker({
                        position: { lat: window.answerCoords.lat, lng: window.answerCoords.lng },
                        map: window.selectMap,
                        title: "Answer",
                        draggable: false,
                    });
                }
            })
            .catch(err => {
                console.error('sendLocation error', err);
                const result = document.getElementById('submit-result');
                result.textContent = 'Send failed: ' + err.message;
                result.style.color = '#a94442';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('submit-btn');
            if (btn) {
                btn.addEventListener('click', function() {
                    if (window.selectMarker) {
                        const pos = window.selectMarker.getPosition();
                        sendLocation(pos.lat(), pos.lng());
                    } else {
                        console.warn('No marker available to submit');
                    }
                });
            }
        });

    </script>

    {% if api_key %}
        <script src="https://maps.googleapis.com/maps/api/js?key={{ api_key }}&callback=initMaps" async defer></script>
    {% endif %}

</body>
</html>
